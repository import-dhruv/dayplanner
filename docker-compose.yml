services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: dayplanner
    ports:
      - "55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d dayplanner"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://planner:planner@db:5432/dayplanner
      SECRET_KEY: change-me-in-production-please-use-a-long-random-string
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8765:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_ORIGIN: http://localhost:8765
    environment:
      NEXT_PUBLIC_API_ORIGIN: http://localhost:8765
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
